<!DOCTYPE html>
<html lang="vi">
<head>
  <meta name="tp-lesson" content="{{SLUG}}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} - TensorPlay</title>
  <meta name="description" content="{{SUMMARY}}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="../../shared/styles/tokens.css">
  <link rel="stylesheet" href="../../shared/styles/layout.css">
  <link rel="stylesheet" href="../../shared/styles/components.css">
</head>
<body class="theme-dark">
  <div class="lab-shell">
    <header class="lab-header">
      <div class="lab-header-left">
        <a href="../../index.html" class="lab-header-title">
          <span style="color: var(--color-warning);">⚡</span>
          <span>Tensor<span style="color: var(--color-info);">Play</span></span>
        </a>
        <a href="../../index.html" class="btn-back-catalog">← Về Danh Mục</a>
      </div>
      <div class="lab-header-right">
        <span class="tp-badge tp-badge-step" data-topic-badge></span>
      </div>
    </header>

    <main class="lab-grid">
      <section class="lab-col col-narrative">
        <div class="lab-col-header">
          <span class="lab-col-title">Cột 1 • Khung Dẫn Dắt &amp; Chú Giải</span>
        </div>
        <div class="lab-col-body">
          <div id="mount-step-wizard"></div>
          <div id="mount-comment-section"></div>
          <div id="mount-formula-summary" style="display: none;"></div>
        </div>
      </section>

      <section class="lab-col col-sandbox">
        <div class="lab-col-header">
          <span class="lab-col-title">Cột 2 • Bàn Thí Nghiệm (TODO)</span>
          <button id="btn-reset" class="tp-btn tp-btn-ghost" style="padding: 4px 10px;">↺ Đặt Lại</button>
        </div>
        <div class="lab-col-body" style="display: flex; flex-direction: column; gap: 1.1rem;">
          <div id="mount-preset-picker" style="width: 100%;"></div>
          <div class="tp-panel">
            <div class="tp-panel-title">🎚️ Tham số $x$ (TODO)</div>
            <div id="mount-x-slider"></div>
            <div class="tp-matrix-caption" id="txt-x"></div>
          </div>
        </div>
      </section>

      <section class="lab-col col-telemetry">
        <div class="lab-col-header">
          <span class="lab-col-title">Cột 3 • Live Math &amp; Telemetry</span>
          <span style="font-size: 0.65rem; color: var(--color-positive); font-weight: 700;">● REALTIME</span>
        </div>
        <div class="lab-col-body" style="display: flex; flex-direction: column; gap: 1.1rem;">
          <div class="tp-panel">
            <div class="tp-panel-title">📐 Công thức sống</div>
            <div class="tp-math-box" id="katex-main"></div>
          </div>
          <div class="tp-panel">
            <div class="tp-panel-title">📊 Số liệu</div>
            <table class="tp-kv-table" id="stats-table"></table>
          </div>
          <div class="tp-verdict" id="verdict"></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { createStepWizard } from '../../shared/components/StepWizard.js';
    import { createLiveSlider } from '../../shared/components/LiveSlider.js';
    import { createPresetPicker } from '../../shared/components/PresetPicker.js';
    import { createCommentSection } from '../../shared/components/CommentSection.js';
    import { createFormulaSummary } from '../../shared/components/FormulaSummary.js';
    import { renderMath, renderAllInlineMath } from '../../shared/katex-render.js';
    import { markCompleted } from '../../shared/progress.js';
    import { LessonLogic, PRESETS } from './logic.js';

    const LESSON_ID = '{{SLUG}}';

    const STEPS = [
      {
        step: 1, badge: 'Bước 1 / 3',
        heading: 'TODO: tiêu đề bước 1',
        problem: 'TODO: nêu tình huống thực / câu hỏi gây tò mò. Có thể nhắc bài khác bằng [[lesson:slug_bai_khac]] (không bao giờ viết "Bài NN").',
        mechanism: 'TODO: cơ chế toán, dùng $...$ cho công thức. Lưu ý: không dùng **đậm** (StepWizard không render Markdown), xuống dòng bằng \n.',
        action: '👉 Thao tác (Cột 2): TODO.\n👁️ Quan sát (Cột 3): TODO.',
        takeaway: 'TODO: điều rút ra (một "Aha!" duy nhất).'
      },
      {
        step: 2, badge: 'Bước 2 / 3',
        heading: 'TODO: tiêu đề bước 2',
        problem: 'TODO',
        mechanism: 'TODO',
        action: '👉 Thao tác: TODO\n👁️ Quan sát: TODO',
        takeaway: 'TODO'
      },
      {
        step: 3, badge: 'Bước 3 / 3',
        heading: '📐 Sổ Tay Công Thức Cốt Lõi',
        isFormulaSlide: true
      }
    ];

    const STEP_COMMENTS = {
      2: [{
        id: 'tpl2', author: 'Kỹ Sư AI', role: 'Systems', avatar: '🚀', tag: 'Gotcha kinh điển', tagType: 'gotcha',
        content: 'TODO: một cái bẫy thực tế. tagType: math | gotcha | systems.'
      }]
    };

    const FORMULAS = [
      {
        id: 'tpl-f1',
        title: 'TODO: Công thức toán cốt lõi 1',
        formula: 'y = f(x)',
        description: 'TODO: Ý nghĩa toán học và vai trò trong hệ thống.',
        takeaway: 'TODO: Điểm then chốt cần ghi nhớ.',
        tags: ['Toán Học']
      }
    ];

    const logic = new LessonLogic();

    const comments = createCommentSection(document.getElementById('mount-comment-section'), {
      lessonId: LESSON_ID, initialStep: 1, curatedComments: STEP_COMMENTS[1] || [], allowUserNotes: true
    });

    createFormulaSummary(document.getElementById('mount-formula-summary'), {
      title: 'Tổng Hợp Công Thức Cần Nhớ',
      formulas: FORMULAS
    });

    createStepWizard(document.getElementById('mount-step-wizard'), {
      steps: STEPS,
      initialStep: 1,
      onStepChange: (n) => {
        comments.setStep(n, STEP_COMMENTS[n] || []);
        if (n === STEPS.length) markCompleted(LESSON_ID, true);
      }
    });

    const sX = createLiveSlider(document.getElementById('mount-x-slider'), {
      label: 'x', min: 0, max: 5, step: 1, initial: logic.state.x,
      onChange: (v) => { logic.onUserUpdate({ x: v }); presets.setActive(null); render(); }
    });

    function syncControls() {
      sX.setValue(logic.state.x);
    }

    const presets = createPresetPicker(document.getElementById('mount-preset-picker'), {
      presets: PRESETS,
      initialActiveId: 'default',
      onPick: (p) => {
        logic.applyPreset(p.state);
        syncControls();
        render();
      }
    });

    // TODO: gắn thêm các nút phân đoạn (seg) nếu cần, giống các bài mẫu.

    function render() {
      const r = logic.calculate();
      const s = logic.state;
      document.getElementById('txt-x').textContent = `x = ${s.x}`;
      renderMath(document.getElementById('katex-main'), r.formulaKaTeX, { displayMode: true });
      document.getElementById('stats-table').innerHTML = `<tr><td>x</td><td>${r.x}</td></tr><tr><td>y</td><td>${r.y}</td></tr>`;
      const verdict = document.getElementById('verdict');
      verdict.className = `tp-verdict ${r.verdict.type}`;
      verdict.textContent = r.verdict.text;
    }

    document.getElementById('btn-reset').addEventListener('click', () => {
      logic.reset();
      syncControls();
      presets.setActive('default');
      render();
    });

    renderAllInlineMath(document.querySelector('.col-sandbox'));
    render();
  </script>

  <script type="module" src="../../shared/components/LessonNav.js"></script>
</body>
</html>
